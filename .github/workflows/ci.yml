name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ssh_academy
          POSTGRES_USER: ssh_academy
          POSTGRES_PASSWORD: ssh_academy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ssh_academy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ssh_academy:ssh_academy@localhost:5432/ssh_academy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Migrationen gegen leere Datenbank
        run: pnpm db:migrate
      - name: Schema und Migrationen stimmen überein
        run: |
          pnpm --filter @ssh-academy/db generate --name ci-check
          git status --porcelain packages/db/migrations
          test -z "$(git status --porcelain packages/db/migrations)"
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Images bauen
        run: |
          docker build --target migrate -t ssh-academy-migrate .
          docker build --target web -t ssh-academy-web .
